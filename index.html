<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Backlog Colossus</title>
<style>
:root { --bg:#0a0a0a; --card:#121212; --ink:#f6f5f1; --mute:#adadaa; --line:#303030; --accent:#f6f5f1; --on-accent:#000; --bad:#ff4d5e; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
[hidden] { display:none !important; }
form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-top:3px solid #e8182e; padding:24px; }
h1 { font:400 28px/1.1 Impact,"Arial Narrow",sans-serif; letter-spacing:.03em; text-transform:uppercase; margin:0 0 6px; }
p { margin:0 0 16px; color:var(--mute); font-size:14px; }
input[type=password],input[type=text] { width:100%; font:inherit; padding:12px; border:1px solid var(--line); background:transparent; color:inherit; }
.fld { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; }
.opt { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--mute); margin:12px 0 0; }
.why { display:block; font-size:12.5px; color:var(--mute); margin:4px 0 16px 25px; }
button { width:100%; font:inherit; font-weight:600; padding:12px; border:0; background:var(--accent); color:var(--on-accent); cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
#msg { min-height:20px; margin:12px 0 0; color:var(--bad); font-size:14px; }
</style>
</head>
<body>
<form id="f" method="post" action="about:blank" target="sink" autocomplete="on">
  <h1>Backlog Colossus</h1>
  <p>Cette page est protégée par un mot de passe.</p>
  <label class="fld" for="username">Compte</label>
  <input id="username" name="username" type="text" value="colossus" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label class="fld" for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required>
  <label class="opt"><input id="show" type="checkbox"> Afficher le mot de passe</label>
  <label class="opt"><input id="remember" type="checkbox"> Se souvenir sur cet appareil</label>
  <small class="why">Quiconque a cet appareil verra alors la page, sans mot de passe.</small>
  <button id="go" type="submit">Ouvrir</button>
  <div id="msg" role="alert"></div>
</form>

const KEY = 'colossus-backlog-key'; // the derived key, never the password
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = a => btoa(String.fromCharCode(...a));
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.salt), iterations: D.iter }, base, 512));
}
async function unseal(km) {
  const iv = bytes(D.iv), ct = bytes(D.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  const hm = await crypto.subtle.importKey('raw', km.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!await crypto.subtle.verify('HMAC', hm, bytes(D.mac), signed)) return null;
  const aes = await crypto.subtle.importKey('raw', km.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aes, ct));
}
function show(html, kept) {
  document.open(); document.write(html); document.close();
  if (!kept) return;
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = 'Oublier sur cet appareil';
  b.style.cssText = 'display:block;margin:24px auto 32px;padding:12px 16px;font:inherit;font-size:14px;color:inherit;background:none;border:1px solid currentColor;cursor:pointer';
  b.addEventListener('click', () => { store.del(); b.textContent = 'Oublié : le mot de passe sera redemandé'; b.disabled = true; });
  document.body.append(b);
}
const $ = id => document.getElementById(id);
$('show').addEventListener('change', e => { $('password').type = e.target.checked ? 'text' : 'password'; });

// Already remembered on this device: open without asking. A key that no longer fits is dropped.
const saved = store.get();
if (saved) {
  $('f').hidden = true;
  const auto = async () => { // after the load: a write during parsing would land inside this screen
    try {
      const html = await unseal(bytes(saved));
      if (html !== null) return show(html, true);
      store.del();
    } catch (err) { store.del(); }
    $('f').hidden = false;
  };
  if (document.readyState === 'complete') auto(); else window.addEventListener('load', auto);
}

// Two steps. First the check, in the browser. Then a real form submission, which is what Safari watches
// before it offers to save the password. It goes to about:blank in a hidden frame: nothing leaves the device.
let opened = null;
$('f').addEventListener('submit', async e => {
  if (opened) { setTimeout(() => show(opened.html, opened.kept), 400); return; }
  e.preventDefault();
  $('msg').textContent = ''; $('go').disabled = true; $('go').textContent = 'Ouverture…';
  try {
    const km = await derive($('password').value.trim().toLowerCase());
    const html = await unseal(km);
    if (html === null) { $('msg').textContent = 'Mot de passe incorrect.'; return; }
    const kept = $('remember').checked && store.set(b64(km));
    opened = { html, kept };
    if ($('f').requestSubmit) $('f').requestSubmit();
    else { $('f').submit(); setTimeout(() => show(html, kept), 400); }
  } catch (err) {
    $('msg').textContent = window.crypto && crypto.subtle ? "La page n'a pas pu s'ouvrir." : 'Ce navigateur ne peut pas ouvrir cette page.';
  } finally {
    const b = $('go');
    if (b) { b.disabled = false; b.textContent = 'Ouvrir'; }
  }
});
})();
